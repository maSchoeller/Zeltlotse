name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bind-custom-domain:
        description: >
          Custom-Domain-Bindung anlegen. Erst auf true stellen, nachdem beim
          ersten Deploy die DNS-Einträge gesetzt wurden — siehe design.md,
          Abschnitt "Sequenzierung".
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: docker/setup-buildx-action@v3

      # Docker-Repository-Namen müssen komplett kleingeschrieben sein;
      # github.repository_owner behält die tatsächliche Groß-/Kleinschreibung
      # des GitHub-Kontos (hier "maSchoeller") und muss deshalb umgewandelt
      # werden, bevor er in einen Image-Tag einfließt.
      - name: Image-Namen vorbereiten
        id: image
        run: echo "server=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zeltlotse-server" >> "$GITHUB_OUTPUT"

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Server-Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Zeltlotse.Server/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.server }}:${{ github.sha }}
            ${{ steps.image.outputs.server }}:latest

      - name: Client für die Produktion veröffentlichen
        run: |
          echo "{\"Api\": \"https://api.${{ vars.DOMAIN_NAME }}\"}" \
            > src/Zeltlotse.Client/wwwroot/appsettings.json
          dotnet publish src/Zeltlotse.Client/Zeltlotse.Client.csproj \
            -c Release -o "${{ runner.temp }}/client-publish"

      - name: Bei Azure anmelden (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Läuft direkt auf dem Runner statt im minimalen azure-cli-Docker-Image
      # (dem u.a. tar und sqlcmd fehlen) — azure/login meldet die
      # CLI-Installation des Runners selbst an, das reicht für alle
      # folgenden az-Aufrufe.
      #
      # ghcrToken: bewusst GHCR_PULL_TOKEN (ein langlebiges Personal Access
      # Token, Scope nur read:packages), nicht das eingebaute GITHUB_TOKEN.
      # GITHUB_TOKEN gilt nur für die Laufzeit dieses einen Workflow-Laufs —
      # das reicht zum Bauen/Pushen des Images hier im selben Lauf, aber
      # Container Apps zieht das Image später erneut (z.B. nach
      # Skalierung auf 0 Instanzen) mit dem in Key Vault gespeicherten
      # Wert, dann ist GITHUB_TOKEN längst abgelaufen (ImagePullBackOff).
      - name: Infrastruktur ausrollen (Bicep)
        run: |
          az deployment sub create \
            --location germanywestcentral \
            --template-file infra/main.bicep \
            --parameters \
              domainName="${{ vars.DOMAIN_NAME }}" \
              sqlAadAdminObjectId="${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}" \
              sqlAadAdminLogin="${{ vars.SQL_AAD_ADMIN_LOGIN }}" \
              serverImage="${{ steps.image.outputs.server }}:${{ github.sha }}" \
              ghcrUsername="${{ github.actor }}" \
              ghcrToken="${{ secrets.GHCR_PULL_TOKEN }}" \
              jwtSigningKey="${{ secrets.JWT_SIGNING_KEY }}" \
              bindCustomDomain="${{ github.event.inputs.bind-custom-domain || 'false' }}"

      # Verbindet sich einmal pro Deploy als AAD-Administrator, um die
      # Managed Identity als Datenbankbenutzer bekannt zu machen — ohne das
      # kann sich die Server-Identität nicht per Active-Directory-Managed-
      # Identity-Auth anmelden. DROP+CREATE statt eines Namens-Existenz-Checks:
      # ein per Name aufgelöster CREATE USER (ohne WITH OBJECT_ID) kann sich
      # falsch binden ("Login failed for user '<token-identified principal>'"
      # trotz erfolgreichem CREATE) — DROP+CREATE mit fester Objekt-ID heilt
      # das bei jedem Deploy selbst.
      #
      # Ein fertiges Zugriffstoken übergibt man sqlcmd schlicht über
      # "-G -P <token>" (ab sqlcmd v17.8) — nicht über
      # --authentication-method, das dafür keinen passenden Wert kennt (nur
      # Default/Managed Identity/Service Principal u.ä., aber kein "fertiges
      # Token einfach so entgegennehmen").
      - name: sqlcmd installieren
        run: |
          curl -sL https://github.com/microsoft/go-sqlcmd/releases/download/v1.10.0/sqlcmd-linux-amd64.tar.bz2 -o /tmp/sqlcmd.tar.bz2
          tar xjf /tmp/sqlcmd.tar.bz2 -C /tmp
          chmod +x /tmp/sqlcmd

      # Der SQL-Administrator ist die GitHub-Actions-App selbst (siehe
      # sql.bicep) — nur so kann der Deploy-Workflow laufend Rechte an neue
      # Identitäten vergeben. Der zweite Block richtet zusätzlich einen
      # vollwertigen Datenbankzugang für den menschlichen Verwalter ein
      # (SQL_AAD_ADMIN_OBJECT_ID/-LOGIN aus requirements.md sind jetzt die
      # der App; der Mensch bekommt seinen Zugang hier, nicht über die
      # Server-Admin-Rolle). WITH OBJECT_ID vermeidet Unsicherheiten beim
      # genauen UPN-Format von Gastkonten.
      - name: Datenbankrechte für die Server-Identität und den Verwalter setzen
        run: |
          ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          SQL_SERVER=$(az deployment group show -g zeltlotse-produktion -n sql --query properties.outputs.serverName.value -o tsv)
          SERVER_IDENTITY_PRINCIPAL_ID=$(az identity show --name zeltlotse-server-identity --resource-group zeltlotse-produktion --query principalId -o tsv)

          /tmp/sqlcmd -S "${SQL_SERVER}.database.windows.net" -d zeltlotse -G -P "$ACCESS_TOKEN" \
            -Q "DROP USER IF EXISTS [zeltlotse-server-identity];
                CREATE USER [zeltlotse-server-identity] FROM EXTERNAL PROVIDER WITH OBJECT_ID = '$SERVER_IDENTITY_PRINCIPAL_ID';
                ALTER ROLE db_datareader ADD MEMBER [zeltlotse-server-identity];
                ALTER ROLE db_datawriter ADD MEMBER [zeltlotse-server-identity];
                ALTER ROLE db_ddladmin ADD MEMBER [zeltlotse-server-identity];
                GRANT ALTER ANY SECURITY POLICY TO [zeltlotse-server-identity];
                GRANT ALTER ANY SCHEMA TO [zeltlotse-server-identity];

                DROP USER IF EXISTS [Marvin Schoeller];
                CREATE USER [Marvin Schoeller] FROM EXTERNAL PROVIDER WITH OBJECT_ID = '${{ vars.HUMAN_ADMIN_OBJECT_ID }}';
                ALTER ROLE db_owner ADD MEMBER [Marvin Schoeller];"

      - name: Migration ausführen
        run: |
          az containerapp job start --name zeltlotse-migration --resource-group zeltlotse-produktion

          # az containerapp job start kehrt zurück, sobald die Ausführung
          # gestartet ist, nicht wenn sie fertig ist — deshalb aktiv auf
          # den Endzustand warten und bei Fehlschlag abbrechen.
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution list \
              --name zeltlotse-migration --resource-group zeltlotse-produktion \
              --query "[0].properties.status" -o tsv)

            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "Migration fehlgeschlagen — Deploy bricht ab, alte Version bleibt aktiv."
              exit 1
            fi

            sleep 10
          done

          echo "Migration hat nach 5 Minuten nicht abgeschlossen."
          exit 1

      - name: Client zu Azure Static Web Apps ausrollen
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ${{ runner.temp }}/client-publish/wwwroot
          output_location: ""
          skip_app_build: true
